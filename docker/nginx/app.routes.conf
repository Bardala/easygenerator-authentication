root /usr/share/nginx/html;
index index.html;
client_max_body_size 16k;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
error_page 413 = @body_too_large;
error_page 502 504 = @upstream_unavailable;
location @body_too_large {
  default_type application/json;
  return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"The request body is too large."}';
}
location @upstream_unavailable {
  default_type application/json;
  return 503 '{"code":"DEPENDENCY_UNAVAILABLE","message":"The API is unavailable."}';
}
location = /healthz { default_type text/plain; return 200 'ok'; }
location /api/ {
  # API security headers come from Helmet; preserve local Swagger CSP behavior.
  add_header X-Content-Type-Options nosniff always;
  proxy_pass http://backend:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  # Overwrite client-supplied forwarding headers; the API trusts this one proxy.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_intercept_errors off;
}
location /assets/ { expires 1y; try_files $uri =404; }
location = /index.html { expires -1; }
location / { try_files $uri $uri/ /index.html; }

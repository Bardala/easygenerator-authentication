services:
  frontend:
    volumes:
      - ./docker/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH}:/etc/nginx/tls/key.pem:ro
    healthcheck:
      # TLS verification is performed by clients; this internal readiness probe
      # addresses loopback rather than the certificate's public hostname.
      test:
        [
          CMD,
          wget,
          --no-check-certificate,
          -q,
          -O,
          /dev/null,
          'https://127.0.0.1:8080/healthz',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
